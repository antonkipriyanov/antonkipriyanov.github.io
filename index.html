<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mainstage Radar — Listen</title>
<!-- The Mini App «▶ Слушать» (P21-2, ADR-0011): the channel's header and a service's own player of the release —
     Apple Music's, or YouTube's when the draft has no Apple Music link. The sound is streamed by the service; this
     page keeps nothing. It is static — the user publishes it on GitHub Pages and registers it as the bot's Mini App
     (BotFather); the post's button opens it as
       https://t.me/<bot>?startapp=<album>_<song>   (or <album>, or _<song>) — Apple Music ids;
       https://t.me/<bot>?startapp=dza_<album>     (or dzt_<track>) — Deezer's widget, while the blog makes no money;
       https://t.me/<bot>?startapp=yt_<video>      — the YouTube Music auto-track. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --lime: #D8FF3B; --white: #F5F5EF; --black: #0B0B0C; --muted: rgba(245, 245, 239, .62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--black); color: var(--white);
               font-family: Montserrat, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
  .brand b { display: block; letter-spacing: .3em; font-size: 15px; }
  .brand span { display: block; letter-spacing: .55em; font-size: 13px; font-weight: 300; color: var(--muted); }
  .dash { width: 32px; height: 4px; background: var(--lime); margin: 10px 0 28px; }
  h1 { font-size: 40px; line-height: 1.02; margin: 0 0 8px; letter-spacing: .01em; text-transform: uppercase;
       overflow-wrap: anywhere; }
  .artist { letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 24px; }
  iframe { width: 100%; height: 175px; border: 0; border-radius: 12px; overflow: hidden; background: #1a1a1c; }
  iframe.video { height: auto; aspect-ratio: 16 / 9; }
  iframe.widget { height: 300px; }
  iframe.album { height: 450px; }  /* Apple's album embed: the cover beside the track list */
  .note { margin-top: 20px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .note a { color: var(--white); }
  .diag { margin-top: 24px; padding: 12px; border: 1px solid rgba(216, 255, 59, .35); border-radius: 10px;
          font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><b>MAINSTAGE</b><span>RADAR</span></div>
  <div class="dash"></div>
  <h1 id="title"></h1>
  <p class="artist" id="artist"></p>
  <!-- Apple's own embed (Apple Music Marketing Tools), its address the one Apple's lookup gives — or YouTube's
       embedded player, YouTube's branding on it as its policies ask. Not the privacy-enhanced youtube-nocookie.com:
       there YouTube does not see a viewer who is signed in and asks to «confirm that you're not a bot» (24.10). -->
  <!-- referrerpolicy: YouTube's player refuses with «Error 153» when it cannot tell which page embeds it. -->
  <iframe id="player" hidden referrerpolicy="strict-origin-when-cross-origin"
          allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write; picture-in-picture"
          sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe>
  <p class="note" id="note"></p>
  <!-- An embedded YouTube player makes the page a YouTube API client: its Terms of Service and Google's Privacy
       Policy are linked where the player is (YouTube API Services — Developer Policies, III.A). -->
  <p class="note" id="youtube-terms" hidden>The player is YouTube's: <a href="https://www.youtube.com/t/terms">YouTube
    Terms of Service</a> · <a href="https://policies.google.com/privacy">Google Privacy Policy</a>.</p>
  <div class="diag" id="diag" hidden></div>
</main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* outside Telegram the calls are no-ops */ } }
  const query = new URLSearchParams(location.search);
  // The release: startapp of the post's button — or ?am= when the page is opened as a plain link.
  const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || query.get("am") || "";
  const said = [];

  function nothing(why) {
    document.getElementById("title").textContent = "Open from a post";
    document.getElementById("note").textContent = "The player opens from a post's «▶ Слушать» button.";
    said.push(why);
  }

  const NOTES = {
    apple: "Tap ▶ Play in the player. Without an Apple Music subscription it plays a preview; signed in — the whole track.",
    youtube: "Tap ▶ in the player: it is the release's official audio on YouTube.",
    deezer: "Tap ▶ in the player. Without a Deezer subscription it plays a preview.",
  };
  const player = document.getElementById("player");

  function show(title, artist, src, note, video) {
    document.getElementById("title").textContent = title;
    document.getElementById("artist").textContent = artist;
    document.getElementById("note").textContent = note;
    player.classList.toggle("video", video);
    player.classList.toggle("widget", src.startsWith("https://widget.deezer.com/"));
    player.classList.toggle("album", src.startsWith("https://embed.music.apple.com/") && !src.includes("?i="));
    document.getElementById("youtube-terms").hidden = !video;
    player.src = src;
    player.hidden = false;
    said.push("player: " + src);
  }

  const youtube = /^yt_([A-Za-z0-9_-]{11})$/.exec(start);
  const deezer = /^dz([at])_(\d+)$/.exec(start);
  const ids = /^(\d*)(?:_(\d+))?$/.exec(start);
  const found = Boolean(youtube) || Boolean(deezer) || Boolean(ids && (ids[1] || ids[2]));
  if (deezer) {
    // Deezer's API answers a page only as JSONP (no CORS header, checked 24.10) — the way it documents itself.
    const kind = deezer[1] === "a" ? "album" : "track";
    const id = deezer[2];
    window.__deezer = (about) => {
      show((about && about.title) || "", (about && about.artist && about.artist.name) || "",
           `https://widget.deezer.com/widget/dark/${kind}/${id}`, NOTES.deezer, false);
      diagnose();
    };
    const script = document.createElement("script");
    script.src = `https://api.deezer.com/${kind}/${id}?output=jsonp&callback=__deezer`;
    script.onerror = () => window.__deezer(null);
    document.head.append(script);
  } else if (youtube) {
    // The names are YouTube's own (its oEmbed is CORS-open, checked 24.10): an auto-track is «<song>» by «<artist> - Topic».
    const video = youtube[1];
    const watch = `https://www.youtube.com/watch?v=${video}`;
    fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(watch)}`)
      .then((r) => (r.ok ? r.json() : {}))
      .catch(() => ({}))
      .then((about) => show(about.title || "", (about.author_name || "").replace(/ - Topic$/, ""),
                            `https://www.youtube.com/embed/${video}`, NOTES.youtube, true))
      .finally(diagnose);
  } else if (found) {
    // The names and the player's address are Apple's (its lookup is CORS-open, checked 24.10): nothing is built here
    // from the ids — the player gets the page Apple gives. A song asked for, or an album of one song (a single), plays
    // as that song — Apple's compact player; an album of several, as the album — its cover beside the track list.
    const [, album, song] = ids;
    const embed = (url) => {
      const page = new URL(url);
      page.searchParams.delete("uo");
      return page.href.replace("https://music.apple.com/", "https://embed.music.apple.com/");
    };
    const lookup = song ? `id=${song}` : `id=${album}&entity=song`;
    fetch(`https://itunes.apple.com/lookup?${lookup}&country=us`)
      .then((r) => r.json())
      .then((answer) => {
        const results = answer.results || [];
        const songs = results.filter((r) => r.wrapperType === "track");
        const one = song ? results[0] : songs.length === 1 ? songs[0] : null;
        if (one) {
          show(one.trackName, one.artistName, embed(one.trackViewUrl), NOTES.apple, false);
          return;
        }
        const collection = results.find((r) => r.wrapperType === "collection");
        if (!collection) throw new Error("Apple has nothing at " + (song || album));
        show(collection.collectionName.replace(/ - (Single|EP)$/, ""), collection.artistName,
             embed(collection.collectionViewUrl), NOTES.apple, false);
      })
      .catch((e) => nothing("lookup failed: " + e.message))
      .finally(diagnose);
  } else {
    nothing("no release in the start parameter");
  }

  // ?debug=1 — where the page runs and what it was told, for a check on a phone.
  function diagnose() {
    if (query.get("debug") !== "1") return;
    const diag = document.getElementById("diag");
    diag.hidden = false;
    diag.textContent = [
      "mini app: " + (tg && tg.initData ? "yes" : "no"),
      "telegram platform: " + (tg ? tg.platform : "—") + ", version " + (tg ? tg.version : "—"),
      "start param: " + (start || "—"),
      ...said,
    ].join("\n");
  }
  if (!found) diagnose();
</script>
</body>
</html>

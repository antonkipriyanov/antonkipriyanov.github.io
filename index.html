<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mainstage Radar — Listen</title>
<!-- P20-8 stub: does Apple Music's own embedded player play inside Telegram? Telegram's script makes the page a
     Mini App when it is opened as one (BotFather /newapp); opened as a plain link it is harmless. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --lime: #D8FF3B; --white: #F5F5EF; --black: #0B0B0C; --muted: rgba(245, 245, 239, .62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--black); color: var(--white);
               font-family: Montserrat, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
  .brand b { display: block; letter-spacing: .3em; font-size: 15px; }
  .brand span { display: block; letter-spacing: .55em; font-size: 13px; font-weight: 300; color: var(--muted); }
  .dash { width: 32px; height: 4px; background: var(--lime); margin: 10px 0 28px; }
  h1 { font-size: 40px; line-height: 1.02; margin: 0 0 8px; letter-spacing: .01em; text-transform: uppercase; }
  .artist { letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 24px; }
  iframe { width: 100%; height: 175px; border: 0; border-radius: 12px; overflow: hidden; background: #1a1a1c; }
  .note { margin-top: 20px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .diag { margin-top: 24px; padding: 12px; border: 1px solid rgba(216, 255, 59, .35); border-radius: 10px;
          font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); word-break: break-word;
          white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <div class="brand"><b>MAINSTAGE</b><span>RADAR</span></div>
  <div class="dash"></div>
  <h1 id="title">Teke Teke</h1>
  <p class="artist" id="artist">NO SENS</p>
  <!-- Apple's own embed snippet (Apple Music Marketing Tools): the sound is streamed by Apple, nothing is ours. -->
  <iframe id="player"
          allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
          sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
          src="https://embed.music.apple.com/us/album/teke-teke/6807199430?i=6807199432"></iframe>
  <p class="note">Tap ▶ Play in the player. Without an Apple Music subscription it plays a preview; signed in — the
    whole track.</p>
  <div class="diag" id="diag">…</div>
</main>
<script>
  // What the test is about: where the page is open — a Mini App, Telegram's in-app browser or a plain browser.
  const tg = window.Telegram && window.Telegram.WebApp;
  const inMiniApp = Boolean(tg && tg.initData);
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) { /* outside Telegram the calls are no-ops */ } }
  // A release other than the stub's: startapp (or ?am=) as «<albumId>_<songId>».
  const start = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("am");
  const m = /^(\d+)(?:_(\d+))?$/.exec(start || "");
  const diagExtra = [];
  if (m) {
    // The names and the player's address come from Apple's own lookup (CORS-open, checked 24.10): the page builds
    // nothing from the ids itself — the player gets the album page Apple gives, with the song if one was asked.
    const [, album, song] = m;
    fetch(`https://itunes.apple.com/lookup?id=${song || album}&country=us`)
      .then((r) => r.json())
      .then((answer) => {
        const item = (answer.results || [])[0];
        if (!item) throw new Error("Apple has nothing at " + (song || album));
        document.getElementById("title").textContent = song ? item.trackName : item.collectionName;
        document.getElementById("artist").textContent = item.artistName;
        const page = new URL(song ? item.trackViewUrl : item.collectionViewUrl);
        page.searchParams.delete("uo");
        document.getElementById("player").src = page.href.replace("https://music.apple.com/", "https://embed.music.apple.com/");
        diagExtra.push("player: " + document.getElementById("player").src);
      })
      .catch((e) => diagExtra.push("lookup failed: " + e.message))
      .finally(showDiag);
  }
  function showDiag() {
    document.getElementById("diag").textContent = [
      "mini app: " + (inMiniApp ? "yes" : "no"),
      "telegram platform: " + (tg ? tg.platform : "—") + ", version " + (tg ? tg.version : "—"),
      "start param: " + (start || "—"),
      ...diagExtra,
      "user agent: " + navigator.userAgent,
    ].join("\n");
  }
  showDiag();
</script>
</body>
</html>
